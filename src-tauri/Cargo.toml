[package]
name = "wishlist-editor"
version = "0.4.2"
description = "Desktop editor for a GitHub Pages wishlist"
authors = ["swchck"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wishlist_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = { version = "0.21.0", features = ["https", "vendored-libgit2"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2", "system-proxy", "form", "query"] }
tokio = { version = "1.53.2", features = ["time", "sync"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# libgit2 talks TLS through SecureTransport on macOS, yet its https feature still links
# openssl-sys on every unix; building it from source keeps x86_64 cross-builds on arm64
# runners from hunting for an Intel OpenSSL that isn't there
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.21.0", features = ["vendored-openssl"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
